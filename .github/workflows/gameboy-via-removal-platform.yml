name: Game Boy via removal platform parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
      - run: bun test tests/gameboy-via-removal-platform.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: via-removal-${{ matrix.os }}
          path: tmp/gameboy-via-removal-routes.json

  compare:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Require identical Linux and macOS route geometry
        run: diff -u results/via-removal-ubuntu-latest/gameboy-via-removal-routes.json results/via-removal-macos-14/gameboy-via-removal-routes.json
