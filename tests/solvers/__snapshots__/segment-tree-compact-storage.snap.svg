<svg width="1100" height="420" viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><rect data-type="rect" data-label="" data-x="550" data-y="210" x="104.76190476190482" y="40" width="890.4761904761904" height="340" fill="transparent" stroke="none" stroke-width="1.2352941176470589"/></g><text data-type="text" data-label="Store each segment once instead of once per covered grid cell" data-x="24" data-y="28" x="124.19047619047619" y="62.66666666666667" fill="#172033" font-size="21.047619047619047" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Store each segment once instead of once per covered grid cell</text><text data-type="text" data-label="Live storage counts: three segments and one repeated input. Identical query candidates and endpoint objects." data-x="24" data-y="66" x="124.19047619047619" y="93.42857142857143" fill="#172033" font-size="12.952380952380953" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Live storage counts: three segments and one repeated input. Identical query candidates and endpoint objects.</text><text data-type="text" data-label="Metric" data-x="24" data-y="120" x="124.19047619047619" y="137.14285714285714" fill="#172033" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Metric</text><text data-type="text" data-label="Before" data-x="424" data-y="120" x="448" y="137.14285714285714" fill="#b45309" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Before</text><text data-type="text" data-label="After" data-x="764" data-y="120" x="723.2380952380952" y="137.14285714285714" fill="#047857" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">After</text><text data-type="text" data-label="Input segments" data-x="24" data-y="168" x="124.19047619047619" y="176" fill="#172033" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Input segments</text><text data-type="text" data-label="4" data-x="424" data-y="168" x="448" y="176" fill="#b45309" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">4</text><text data-type="text" data-label="4" data-x="764" data-y="168" x="723.2380952380952" y="176" fill="#047857" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">4</text><text data-type="text" data-label="Retained segment entries" data-x="24" data-y="216" x="124.19047619047619" y="214.85714285714286" fill="#172033" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Retained segment entries</text><text data-type="text" data-label="76" data-x="424" data-y="216" x="448" y="214.85714285714286" fill="#b45309" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">76</text><text data-type="text" data-label="3" data-x="764" data-y="216" x="723.2380952380952" y="214.85714285714286" fill="#047857" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">3</text><text data-type="text" data-label="Storage layout" data-x="24" data-y="264" x="124.19047619047619" y="253.71428571428572" fill="#172033" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Storage layout</text><text data-type="text" data-label="36 grid buckets" data-x="424" data-y="264" x="448" y="253.71428571428572" fill="#b45309" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">36 grid buckets</text><text data-type="text" data-label="packed bucket bounds" data-x="764" data-y="264" x="723.2380952380952" y="253.71428571428572" fill="#047857" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">packed bucket bounds</text><text data-type="text" data-label="Query candidate order" data-x="24" data-y="312" x="124.19047619047619" y="292.57142857142856" fill="#172033" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Query candidate order</text><text data-type="text" data-label="A -&gt; B -&gt; C" data-x="424" data-y="312" x="448" y="292.57142857142856" fill="#b45309" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central"><![CDATA[A -> B -> C]]></text><text data-type="text" data-label="A -&gt; B -&gt; C" data-x="764" data-y="312" x="723.2380952380952" y="292.57142857142856" fill="#047857" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central"><![CDATA[A -> B -> C]]></text><text data-type="text" data-label="Endpoint object references" data-x="24" data-y="360" x="124.19047619047619" y="331.42857142857144" fill="#172033" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Endpoint object references</text><text data-type="text" data-label="original objects" data-x="424" data-y="360" x="448" y="331.42857142857144" fill="#b45309" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">original objects</text><text data-type="text" data-label="original objects" data-x="764" data-y="360" x="723.2380952380952" y="331.42857142857144" fill="#047857" font-size="14.571428571428571" font-family="sans-serif" text-anchor="start" dominant-baseline="central">original objects</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="420" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1100" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1100');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '420');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":0.8095238095238095,"c":0,"e":104.76190476190476,"b":0,"d":0.8095238095238095,"f":40};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>