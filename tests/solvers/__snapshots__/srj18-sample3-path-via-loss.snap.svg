a-label="" data-x="-5.830675076075652" data-y="3.083685570296547" cx="254.0351609899741" cy="230.83435556637855" r="6.310222489764242" fill="rgba(37, 99, 235, 0.35)" stroke="#2563eb" stroke-width="0.023770952647598986"/><circle data-type="circle" data-label="" data-x="-5.280675076075651" data-y="0.9336855702965465" cx="277.172643452443" cy="321.28087791966607" r="6.310222489764242" fill="rgba(37, 99, 235, 0.35)" stroke="#2563eb" stroke-width="0.023770952647598986"/><circle data-type="circle" data-label="" data-x="-1.5306750760756511" data-y="-5.0663144297034535" cx="434.92820569654907" cy="573.6897775102358" r="6.310222489764242" fill="rgba(37, 99, 235, 0.35)" stroke="#2563eb" stroke-width="0.023770952647598986"/><g><circle data-type="point" data-label="z3" data-x="-7.62" data-y="7.62" cx="178.76157181368666" cy="40" r="3" fill="#111827"/><text x="183.76157181368666" y="35" font-family="sans-serif" font-size="12">z3</text></g><g><circle data-type="point" data-label="z0" data-x="-1.93012" data-y="-4.173814" cx="418.12429674741844" cy="536.1439356193092" r="3" fill="#111827"/><text x="423.12429674741844" y="531.1439356193092" font-family="sans-serif" font-size="12">z0</text></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="620" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="620" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '620');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '620');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":42.06814993176162,"c":0,"e":499.3208742937102,"b":0,"d":-42.06814993176162,"f":360.5593024800235};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></g>
