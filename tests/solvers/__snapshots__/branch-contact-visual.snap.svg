text" data-label="Power branch must remain connected during path cleanup" data-x="-0.5" data-y="2.7" x="332.8141072740632" y="97.40999265246143" fill="#334155" font-size="18.07494489346069" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Power branch must remain connected during path cleanup</text><g><circle data-type="point" data-label="z: 0" data-x="0" data-y="0" cx="408.12637766348274" cy="504.096252755327" r="3" fill="rgba(0, 255, 0, 0.8)"/></g><g><circle data-type="point" data-label="z: 0" data-x="1.0000499975001251" data-y="0" cx="558.7584492928182" cy="504.096252755327" r="3" fill="rgba(0, 255, 0, 0.8)"/></g><g><circle data-type="point" data-label="z: 0" data-x="2" data-y="0.9999500024998749" cx="709.3754592211609" cy="353.4792428269843" r="3" fill="rgba(0, 255, 0, 0.8)"/></g><g><circle data-type="point" data-label="z: 0" data-x="-0.00004999750012513182" data-y="0.9999500024998749" cx="408.1188468129863" cy="353.4792428269843" r="3" fill="rgba(0, 255, 0, 0.8)"/></g><g><circle data-type="point" data-label="z: 0" data-x="-1" data-y="0" cx="257.5018368846437" cy="504.096252755327" r="3" fill="rgba(0, 255, 0, 0.8)"/></g><g><circle data-type="point" data-label="Tail
z: 0" data-x="2" data-y="0.9999500024998749" cx="709.3754592211609" cy="353.4792428269843" r="3" fill="yellow"/></g><g><circle data-type="point" data-label="Head
z: 0" data-x="-0.9999999999999991" data-y="0" cx="257.5018368846438" cy="504.096252755327" r="3" fill="orange"/></g><g><circle data-type="point" data-label="Tentative Head
z: 0" data-x="-0.9999999999999991" data-y="0" cx="257.5018368846438" cy="504.096252755327" r="3" fill="red"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="900" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '900');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":150.62454077883908,"c":0,"e":408.12637766348274,"b":0,"d":-150.62454077883908,"f":504.096252755327};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>