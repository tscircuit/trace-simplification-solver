8171967822" data-y="14.75001610286609" cx="438.79926878712877" cy="239.99355885356454" r="3" fill="rgba(0, 255, 0, 0.8)"/></g><g><circle data-type="point" data-label="z: 3" data-x="2.6" data-y="14.845" cx="524" cy="202" r="3" fill="rgba(0, 255, 0, 0.8)"/></g><g><circle data-type="point" data-label="z: 3" data-x="2.68" data-y="14.845" cx="556" cy="202" r="3" fill="rgba(0, 255, 0, 0.8)"/></g><g><circle data-type="point" data-label="z: 3" data-x="2.753" data-y="14.845" cx="585.2" cy="202" r="3" fill="rgba(0, 255, 0, 0.8)"/></g><g><circle data-type="point" data-label="z: 3" data-x="2.815" data-y="14.845" cx="610" cy="202" r="3" fill="rgba(0, 255, 0, 0.8)"/></g><g><circle data-type="point" data-label="z: 3" data-x="2.802" data-y="14.9" cx="604.8" cy="180" r="3" fill="rgba(0, 255, 0, 0.8)"/></g><g><circle data-type="point" data-label="z: 3" data-x="2.965" data-y="15.075" cx="670" cy="110" r="3" fill="rgba(0, 255, 0, 0.8)"/></g><g><circle data-type="point" data-label="Tail
z: 3" data-x="2.965" data-y="15.075" cx="670" cy="110" r="3" fill="yellow"/></g><g><circle data-type="point" data-label="Head
z: 3" data-x="2.965" data-y="15.075" cx="670" cy="110" r="3" fill="orange"/></g><g><circle data-type="point" data-label="Tentative Head
z: 3" data-x="2.965" data-y="15.075" cx="670" cy="110" r="3" fill="red"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="480" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="800" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '800');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '480');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":400,"c":0,"e":-516,"b":0,"d":-400,"f":6140};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>