ine data-points="159.412,96.602 159.412,96.602" data-type="line" data-label="" points="604.3075732301268,365.7160571123459 604.3075732301268,365.7160571123459" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="4.344957077921946"/></g><g><polyline data-points="159.412,96.602 159.412,96.602" data-type="line" data-label="" points="604.3075732301268,365.7160571123459 604.3075732301268,365.7160571123459" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="4.344957077921946"/></g><g><polyline data-points="159.412,96.602 159.412,96.602" data-type="line" data-label="" points="604.3075732301268,365.7160571123459 604.3075732301268,365.7160571123459" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="4.344957077921946"/></g><g><polyline data-points="159.412,96.602 159.412,96.602" data-type="line" data-label="" points="604.3075732301268,365.7160571123459 604.3075732301268,365.7160571123459" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="4.344957077921946"/></g><g><polyline data-points="159.412,96.602 159.412,96.602" data-type="line" data-label="" points="604.3075732301268,365.7160571123459 604.3075732301268,365.7160571123459" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="4.344957077921946"/></g><g><polyline data-points="159.412,96.602 159.412,96.602" data-type="line" data-label="" points="604.3075732301268,365.7160571123459 604.3075732301268,365.7160571123459" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="4.344957077921946"/></g><g><polyline data-points="159.412,96.602 159.412,96.602" data-type="line" data-label="" points="604.3075732301268,365.7160571123459 604.3075732301268,365.7160571123459" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="4.344957077921946"/></g><g><polyline data-points="159.412,96.602 159.412,96.602" data-type="line" data-label="" points="604.3075732301268,365.7160571123459 604.3075732301268,365.7160571123459" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="4.344957077921946"/></g><g><polyline data-points="159.412,96.602 159.2331560762337,98.34305255293826" data-type="line" data-label="" points="604.3075732301268,365.7160571123459 596.5368815060092,290.0680709831149" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="4.344957077921946"/></g><g><polyline data-points="159.2331560762337,98.34305255293826 159.141,98.43" data-type="line" data-label="" points="596.5368815060092,290.0680709831149 592.5327395489576,286.2902417279329" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="4.344957077921946"/></g><g><polyline data-points="159.141,98.43 159.04537865467742,98.57246335792125" data-type="line" data-label="" points="592.5327395489576,286.2902417279329 588.37803313736,280.1002699744886" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="4.344957077921946"/></g><g><polyline data-points="159.04537865467742,98.57246335792125 159.58034213782412,104.09841598917994" data-type="line" data-label="" points="588.37803313736,280.1002699744886 611.62196686264,40" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="4.344957077921946"/></g><circle data-type="circle" data-label="" data-x="159.41439301909378" data-y="96.49398566666666" cx="604.4115488826174" cy="370.4092335336836" r="4.414476391168697" fill="#ec4899" stroke="black" stroke-width="0.023015187079322496"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="700" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '700');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":43.449570779219464,"c":0,"e":-6322.075403826807,"b":0,"d":-43.449570779219464,"f":4563.031493526505};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>